name: Build ArmIDM Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Standalone ArmIDM.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --clean --name "ArmIDM" --icon "armidm.ico" --version-file "version_info.txt" armidm.py

      - name: Upload ArmIDM.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmIDM-Windows-Executable
          path: |
            dist/ArmIDM.exe
            chrome_extension/
